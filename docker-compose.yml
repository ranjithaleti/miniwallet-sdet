services:
  postgres:
    image: postgres:16
    container_name: miniwallet-db
    environment:
      POSTGRES_DB: miniwallet
      POSTGRES_USER: miniwallet
      POSTGRES_PASSWORD: miniwallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniwallet"]
      interval: 5s
      retries: 10

volumes:
  pgdata: